[workspace]
resolver = "3"
members = ["crates/*", "apps/rb"]
# The Rune desktop app is its own workspace: it pulls a ~170 MB git dependency and a GPU stack.
# Keeping it out means `cargo check`/`test` here never fetch, resolve or feature-unify it.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every crate inherits deps from here, so each dependency is built with one feature set no matter
# which `-p` subset you build: switching between `cargo test -p rb-core` and a full build doesn't
# recompile shared deps. TLS uses `ring` everywhere: no aws-lc-sys (cmake + a large C build).
[workspace.dependencies]
rb-core = { path = "crates/rb-core" }
rb-tokens = { path = "crates/rb-tokens" }
rb-tls = { path = "crates/rb-tls" }
rb-server = { path = "crates/rb-server" }
rb-client = { path = "crates/rb-client" }
rb-tunnel = { path = "crates/rb-tunnel" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws", "matched-path"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "server-graceful", "service", "client-legacy", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic", "compression-gzip", "request-id", "set-header", "timeout", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
await_holding_lock = "deny"

# ---------------------------------------------------------------------------------------------
# Profiles tuned for the edit → check → test loop.
# ---------------------------------------------------------------------------------------------

[profile.dev]
# Line tables keep backtraces useful at a fraction of full debuginfo's codegen + link time.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies: no debuginfo at all (they're built once and cached; smaller objects link faster).
debug = false

# Crypto is the hot path of every TLS test; optimizing just these keeps handshakes in debug tests
# from dominating test time, and they rarely rebuild.
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.rustls]
opt-level = 2

[profile.dev.build-override]
opt-level = 0
debug = false

# Fast optimized builds for local perf checks: incremental + parallel codegen.
[profile.release]
codegen-units = 16
incremental = true
strip = "debuginfo"

# What ships (Docker / releases): slowest to build, smallest and fastest binary.
[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true

# CI: from-scratch builds where incremental state is never reused, so skip writing it, and skip
# debuginfo entirely. `cargo nextest run --cargo-profile ci`.
[profile.ci]
inherits = "dev"
debug = false
incremental = false
