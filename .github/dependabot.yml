version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to the version axum depends on; bump together with axum.
      - dependency-name: tokio-tungstenite
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
