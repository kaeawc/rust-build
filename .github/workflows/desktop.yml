name: Desktop

# The Rune app is its own workspace with a heavy GPU dependency tree, so it only builds when it
# (or a crate it depends on) changes.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/rb-client/**"
      - "crates/rb-core/**"
      - "crates/rb-server/**"
      - "crates/rb-tls/**"
      - "crates/rb-tokens/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Cargo's git fetches of the Rune repo are much faster through the git CLI.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: short

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop-macos
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No --locked: root dependency bumps (Dependabot) change what the shared path crates need,
      # and desktop/Cargo.lock can't be updated by those PRs. Rune itself stays pinned by rev.
      - run: cargo clippy --all-targets --profile ci -- -D warnings
      # Headless layout + input tests, plus backend tests against an embedded server.
      - run: cargo test --profile ci
      - run: cargo build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rb-desktop-macos
          path: desktop/target/release/rb-desktop
