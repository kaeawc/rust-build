name: Web

# The web UI (web/) and its Rust side (crates/rb-web, the ts-rs DTOs). Path-filtered: commits
# that touch neither skip it. Nothing else in CI needs bun.
on:
  push:
    branches: [main]
    paths: &paths
      - "web/**"
      - "crates/rb-web/**"
      - "crates/rb-server/**"
      - "crates/rb-core/**"
      - "crates/rb-tokens/**"
      - "apps/rb/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump together with web/package.json "packageManager".
  BUN_VERSION: 1.4.5
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Lint, types, unit/component tests with the coverage gate, dead code, production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only GitHub-owned actions are allowed, so no oven-sh/setup-bun: npm (preinstalled, with
      # registry integrity checks) installs the pinned version.
      - name: Install bun
        run: npm install --global "bun@${BUN_VERSION}" && bun --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:types
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run coverage:check
      - run: bun run dead-code
      - run: bun run build
      # The router plugin regenerates routeTree.gen.ts on build; a stale committed copy fails here.
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Rust side: ts-rs bindings match the DTOs, then Playwright + axe against the real binary
  # (`rb serve` built with --features web, so the embedded assets and headers are what ships).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: TypeScript bindings match the Rust DTOs
        run: |
          make types
          git diff --exit-code -- web/src/api/gen
          test -z "$(git status --porcelain -- web/src/api/gen)" || { git status --short -- web/src/api/gen; exit 1; }
      - name: Install bun
        run: npm install --global "bun@${BUN_VERSION}" && bun --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: cargo build --locked --profile ci -p rb --features web
      - name: Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: E2E + accessibility
        working-directory: web
        env:
          RB_BIN: ../target/ci/rb
        run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore
