[package]
name = "rb"
description = "rust-build CLI: server, HTTP/WebSocket client, load generator, TLS tunnel, certs, tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rb"
path = "src/main.rs"

[features]
# OpenTelemetry trace export + propagation (`--otlp-endpoint`).
otel = ["rb-telemetry/otel", "rb-server/otel", "rb-client/otel"]
# Postgres user store, migrations and job store (`--database-url`).
postgres = ["rb-db/postgres", "rb-jobs/postgres", "rb-server/postgres"]
# Valkey response cache (`--valkey-url`).
valkey = ["rb-db/valkey", "rb-server/valkey"]
# The web UI embedded in the binary, served by `rb serve` (build it first: `make web`).
web = ["dep:rb-web"]
# Everything (what releases and the Docker image ship).
full = ["otel", "postgres", "valkey", "web"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
rb-client.workspace = true
rb-core.workspace = true
rb-db.workspace = true
rb-jobs.workspace = true
rb-server.workspace = true
rb-tls.workspace = true
rb-tokens.workspace = true
rb-telemetry.workspace = true
rb-tunnel.workspace = true
rb-web = { workspace = true, optional = true }
ring.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The e2e suite mounts a stand-in fallback router (what `--features web` mounts).
axum.workspace = true
