[package]
name = "rb-core"
description = "Dependency-light building blocks: clock, ids, retry, circuit breaker, rate limit, kv, event bus, pagination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Doctests compile and link one binary per example; unit tests cover the same ground far faster.
doctest = false

[features]
# Derive TypeScript bindings (ts-rs) for the DTOs; see `make types`.
ts = ["dep:ts-rs"]

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
