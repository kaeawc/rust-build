[package]
name = "rb-server"
description = "JSON API + WebSocket server: HTTP/1.1 and HTTP/2 (TLS via ALPN or h2c), graceful shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
otel = ["rb-telemetry/otel"]
postgres = ["rb-db/postgres", "rb-jobs/postgres"]
